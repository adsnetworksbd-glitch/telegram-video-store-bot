<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unique Prompt</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://ad.gigapub.tech/script?id="></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        dark: { 900: '#0B0F19', 800: '#151B2B', 700: '#1E293B' },

                        'fade-in': 'fadeIn 0.3s ease-out',

                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',

                    },

                }
            }
        }
    </script>

</head>
<body class="pb-24 antialiased selection:bg-brand-500 selection:text-white">

<!-- NOTIFICATION BANNER -->

<script>
// ========================================================
const firebaseConfig = {
    apiKey: "AIzaSyDMyPp8J3HG09WvlusxoSt_Fc9qqagbdQU",
    authDomain: "telegram-storebot.firebaseapp.com",
    databaseURL: "https://telegram-storebot-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "telegram-storebot",
    storageBucket: "telegram-storebot.firebasestorage.app",
    messagingSenderId: "763175242557",
    appId: "1:763175242557:web:f0b1e6253e444ea7b35354"
};
// ========================================================
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const PERMANENT_DEV_LINK = "https://t.me/Srabon1111";

let state = {
    categories: [], prompts: [], links: {},
    user: { name: "Guest", photo: "", id: null },
    activeCategory: 'All', currentTab: 'home',
    walletBalance: 0, entitlements: {},
    packages: []
};
let favorites = JSON.parse(localStorage.getItem('runPromt_favs') || '[]');
let historyData = JSON.parse(localStorage.getItem('runPromt_history') || '[]');

const scrollObserver = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); scrollObserver.unobserve(e.target); } });
}, { threshold: 0.1 });

document.addEventListener('DOMContentLoaded', () => { initTelegram(); fetchData(); });

// ─── TELEGRAM INIT ───
function initTelegram() {
    if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.setHeaderColor('#0B0F19'); tg.ready();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            state.user = {
                name: `${u.first_name} ${u.last_name || ''}`.trim(),
                photo: u.photo_url || `https://ui-avatars.com/api/?name=${u.first_name}`,
                id: u.id, username: u.username || '',
                initData: tg.initData
            };
            db.ref('users/' + state.user.id).update({
                id: state.user.id, name: state.user.name,
                username: state.user.username, photo: state.user.photo,
                lastActive: firebase.database.ServerValue.TIMESTAMP
            });
        }
    }
    const img = document.getElementById('header-avatar');
    img.src = state.user.photo || 'https://ui-avatars.com/api/?name=User';
    img.onerror = function() { this.src = `https://ui-avatars.com/api/?name=${state.user.name}&background=random`; };
}

function getInitData() { return state.user.initData || ''; }
function getBackendUrl() { return state.links.backendUrl || ''; }

async function apiCall(path, body = null, method = 'POST') {
    const url = getBackendUrl() + path;
    const opts = {
        method,
        headers: { 'Content-Type': 'application/json' }
    };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(url, opts);
    if (!r.ok) {
        const err = await r.json().catch(() => ({ detail: 'Unknown error' }));
        throw new Error(err.detail || 'API Error');
    }
    return r.json();
}

// ─── NOTIFICATIONS ───
function showNotify(msg, type = 'success') {
    const banner = document.getElementById('notify-banner');
    const content = document.getElementById('notify-content');
    const colors = { success: 'bg-green-500/90 text-white', error: 'bg-red-500/90 text-white', info: 'bg-brand-600/90 text-white', warn: 'bg-yellow-500/90 text-dark-900' };
    const icons = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle', warn: 'fa-exclamation-triangle' };
    content.className = `notify-banner mt-2 rounded-2xl p-4 flex items-center gap-3 text-sm font-medium shadow-2xl ${colors[type]}`;
    content.innerHTML = `<i class="fas ${icons[type]}"></i><span>${msg}</span>`;
    banner.classList.remove('hidden');
    setTimeout(() => banner.classList.add('hidden'), 3500);
}

// ─── MONETAG ───
function loadMonetagSdk(zoneId) {
    if (!zoneId) return;
    const existing = document.getElementById('monetag-sdk');
    if (existing) existing.remove();
    const script = document.createElement('script');
    script.id = 'monetag-sdk';
    script.src = '//libtl.com/sdk.js';
    script.setAttribute('data-zone', zoneId);
    script.setAttribute('data-sdk', 'show_' + zoneId);
    document.head.appendChild(script);
}

// ─── FETCH DATA ───
function fetchData() {
    db.ref('categories').on('value', snap => {
        state.categories = snap.val() || ['All'];
        if (!state.categories.includes('All')) state.categories.unshift('All');
        renderCategories();
    });
    db.ref('links').on('value', snap => {
        state.links = snap.val() || {};
        state.links.dev = PERMANENT_DEV_LINK;
        if (state.links.monetagZone) loadMonetagSdk(state.links.monetagZone);
    });
    db.ref('prompts').on('value', snap => {
        const data = snap.val();
        state.prompts = [];
        if (data) Object.keys(data).forEach(k => state.prompts.push({ id: k, ...data[k] }));
        document.getElementById('loading-grid').classList.add('hidden');
        document.getElementById('content-area').classList.remove('hidden');
        refreshCurrentTab();
    });
    // Load wallet & entitlements if user logged in
    setTimeout(() => {
        if (state.user.id) {
            loadWalletBalance();
            loadEntitlements();
        }
    }, 1000);
}

// ─── WALLET ───
async function loadWalletBalance() {
    if (!getBackendUrl() || !getInitData()) return;
    try {
        const data = await apiCall('/api/wallet/balance', { initData: getInitData() });
        state.walletBalance = data.balance || 0;
        const badge = document.getElementById('wallet-badge');
        badge.classList.remove('hidden');
        document.getElementById('wallet-bal-header').innerText = '$' + parseFloat(state.walletBalance).toFixed(2);
    } catch (e) {}
}

async function loadEntitlements() {
    if (!getBackendUrl() || !getInitData()) return;
    try {
        const data = await apiCall('/api/wallet/entitlements', { initData: getInitData() });
        state.entitlements = data.entitlements || {};
    } catch (e) {}
}

function hasAccess(itemId) {
    const ent = state.entitlements[itemId];
    if (!ent) return false;
    if (!ent.isActive && !ent.currentlyActive) return false;
    const expires = ent.expiresAt || -1;
    if (expires === -1) return true;
    return Date.now() < expires;
}

// ─── CATEGORIES ───
function renderCategories() {
    document.getElementById('category-bar').innerHTML = state.categories.map(cat =>
        `<button onclick="filterCategory('${cat}')" class="${state.activeCategory === cat ? 'bg-brand-600 text-white shadow-lg border-brand-500' : 'bg-dark-800 text-gray-400 border-dark-700'} border px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all active:scale-95">${cat}</button>`
    ).join('');
}

function filterCategory(cat) {
    state.activeCategory = cat;
    renderCategories();
    if (state.currentTab === 'home') renderGrid(state.prompts);
}

// ─── TABS ───
function switchTab(tab) {
    state.currentTab = tab;
    document.querySelectorAll('.nav-item').forEach(el => {
        const isActive = el.onclick && el.onclick.toString().includes(`'${tab}'`);
        el.classList.toggle('active', isActive);
        el.classList.toggle('text-brand-500', isActive);
        el.classList.toggle('text-gray-500', !isActive);
    });
    window.scrollTo(0, 0);
    refreshCurrentTab();
}

function refreshCurrentTab() {
    const content = document.getElementById('content-area');
    const catBar = document.getElementById('category-bar');
    content.classList.remove('pt-32', 'pt-20');

    const showCatBar = state.currentTab === 'home';
    catBar.parentElement.classList.toggle('-translate-y-full', !showCatBar);
    content.classList.add(showCatBar ? 'pt-32' : 'pt-20');

    if (state.currentTab === 'home') renderGrid(state.prompts);
    else if (state.currentTab === 'premium') renderPremiumStore();
    else if (state.currentTab === 'store') renderStore();
    else if (state.currentTab === 'wallet') renderWallet();
    else if (state.currentTab === 'favorites') renderGrid(state.prompts.filter(p => favorites.includes(p.id)));
    else if (state.currentTab === 'profile') renderProfile();
}

// ─── RENDER GRID ───
function renderGrid(items, isPremiumTab = false) {
    const container = document.getElementById('content-area');
    const empty = document.getElementById('empty-state');
    if (state.currentTab === 'home' && state.activeCategory !== 'All') {
        items = items.filter(p => Array.isArray(p.categories) ? p.categories.includes(state.activeCategory) : p.category === state.activeCategory);
    }
    container.innerHTML = '';
    container.className = "grid grid-cols-2 gap-3 pb-6";
    if (items.length === 0) {
        container.classList.add('hidden'); empty.classList.remove('hidden'); empty.classList.add('flex');
    } else {
        container.classList.remove('hidden'); empty.classList.add('hidden'); empty.classList.remove('flex');
        container.innerHTML = items.map(item => {
            const displayCat = Array.isArray(item.categories) ? item.categories[0] : (item.category || 'All');
            const isUnlocked = hasAccess(item.id);
            return `<div class="reveal-item group relative aspect-[3/4] bg-dark-800 rounded-2xl overflow-hidden border border-white/5 shadow-xl active:scale-95 transition-transform" onclick="openModal('${item.id}')">
                <img src="${item.img}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-gradient-to-t from-dark-900/95 via-transparent to-transparent"></div>

                ${isUnlocked ? `<div class="absolute top-2 left-2 bg-green-500 text-white text-[10px] font-extrabold px-2 py-0.5 rounded shadow-sm"><i class="fas fa-check"></i> Unlocked</div>` : ''}

function selectDepositAmt(amt) {
    document.getElementById('deposit-amount').value = amt;
    document.querySelectorAll('.deposit-amt-btn').forEach(b => b.classList.remove('border-brand-500', 'text-brand-400'));
}

async function startDeposit(network) {
    const amt = parseFloat(document.getElementById('deposit-amount').value);
    if (!amt || amt < 1) return showNotify('Enter deposit amount (min $1)', 'error');
    if (!getBackendUrl() || !getInitData()) return showNotify('App not fully configured', 'error');

    try {
        const data = await apiCall('/api/payment/deposit/create', {
            initData: getInitData(), amount: amt, network
        });
        openDepositModal(data, network);
    } catch (e) {
        showNotify(e.message, 'error');
    }
}

function openDepositModal(orderData, network) {
    currentCheckoutOrder = orderData;
    currentCheckoutOrder.type = 'deposit';
    document.getElementById('checkout-summary').innerHTML = `
        <div class="flex justify-between"><span class="text-gray-400">Type</span><span class="text-white font-bold">Deposit</span></div>
        <div class="flex justify-between"><span class="text-gray-400">Amount</span><span class="text-green-400 font-bold">${orderData.amount} USDT</span></div>
        <div class="flex justify-between"><span class="text-gray-400">Network</span><span class="text-white">${network}</span></div>
        <div class="flex justify-between"><span class="text-gray-400">Order ID</span><span class="text-xs font-mono text-gray-300">${orderData.orderId}</span></div>`;
    document.getElementById('network-select').classList.add('hidden');
    document.getElementById('payment-instructions').classList.remove('hidden');
    document.getElementById('pay-amount').innerText = orderData.amount;
    document.getElementById('pay-address').innerText = orderData.address;
    document.getElementById('confirm-pay-btn').classList.remove('hidden');
    document.getElementById('confirm-pay-btn').onclick = confirmDeposit;
    startOrderTimer(orderData.expiresAt);
    document.getElementById('checkout-modal').classList.remove('hidden');
    document.getElementById('checkout-modal').classList.add('flex');
}

async function confirmDeposit() {
    const txHash = document.getElementById('tx-hash-input').value.trim();
    if (!txHash) return showNotify('Enter transaction hash', 'error');
    document.getElementById('confirm-pay-btn').classList.add('hidden');
    document.getElementById('verify-status').classList.remove('hidden');
    try {
        const data = await apiCall('/api/payment/deposit/verify', {
            initData: getInitData(),
            orderId: currentCheckoutOrder.orderId,
            txHash
        });
        closeCheckout();
        showNotify(`Deposit confirmed! +$${data.amount} added to wallet`, 'success');
        state.walletBalance = data.newBalance;
        document.getElementById('wallet-bal-header').innerText = '$' + parseFloat(data.newBalance).toFixed(2);
        if (state.currentTab === 'wallet') renderWallet();
    } catch (e) {
        document.getElementById('verify-status').classList.add('hidden');
        document.getElementById('confirm-pay-btn').classList.remove('hidden');
        showNotify(e.message, 'error');
    }
}

async function loadTxHistory() {
    const el = document.getElementById('tx-history');
    if (!el) return;
    if (!getBackendUrl() || !getInitData()) {
        el.innerHTML = '<p class="text-gray-500 text-xs text-center py-4">Backend not configured</p>';
        return;
    }
    try {
        const data = await apiCall('/api/wallet/transactions', { initData: getInitData() });
        const txs = data.transactions || [];
        if (txs.length === 0) {
            el.innerHTML = '<p class="text-gray-500 text-xs text-center py-4">No transactions yet</p>';
            return;
        }
        el.innerHTML = txs.map(tx => {
            const isCredit = tx.type === 'credit';
            const date = tx.createdAt ? new Date(tx.createdAt).toLocaleDateString() : '-';
            return `<div class="flex items-center justify-between py-2.5 border-b border-white/5 last:border-0">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center ${isCredit ? 'bg-green-500/20' : 'bg-red-500/20'}">
                        <i class="fas ${isCredit ? 'fa-arrow-down text-green-400' : 'fa-arrow-up text-red-400'} text-xs"></i>
                    </div>
                    <div>
                        <p class="text-xs font-medium text-white">${tx.reason || (isCredit ? 'Deposit' : 'Purchase')}</p>
                        <p class="text-[10px] text-gray-500">${date}</p>
                    </div>
                </div>
                <span class="font-bold text-sm ${isCredit ? 'text-green-400' : 'text-red-400'}">${isCredit ? '+' : '-'}$${tx.amount}</span>
            </div>`;
        }).join('');
    } catch (e) {
        el.innerHTML = '<p class="text-gray-500 text-xs text-center py-4">Could not load transactions</p>';
    }
}

// ─── PURCHASE HELPERS ───
async function buyContentWallet(itemId, price, duration) {
    if (!getBackendUrl() || !getInitData()) return showNotify('App not configured', 'error');
    if (state.walletBalance < price) return showNotify(`Insufficient balance. Need $${price}`, 'warn');
    if (!confirm(`Buy this prompt for ${price} USDT from your wallet?`)) return;
    try {
        await apiCall('/api/payment/purchase/create', {
            initData: getInitData(), itemId, itemType: 'content', paymentMethod: 'wallet'
        });
        showNotify('Access granted! ✅', 'success');
        await loadWalletBalance(); await loadEntitlements();
        refreshCurrentTab();
    } catch (e) { showNotify(e.message, 'error'); }
}

async function buyPackageWallet(pkgId, price, duration, name) {
    if (!getBackendUrl() || !getInitData()) return showNotify('App not configured', 'error');
    if (state.walletBalance < price) return showNotify(`Insufficient balance. Need $${price}`, 'warn');
    if (!confirm(`Buy "${name}" for ${price} USDT from your wallet?`)) return;
    try {
        await apiCall('/api/payment/purchase/create', {
            initData: getInitData(), itemId: pkgId, itemType: 'package', paymentMethod: 'wallet'
        });
        showNotify(`Package "${name}" activated! ✅`, 'success');
        await loadWalletBalance(); await loadEntitlements();
        renderStore();
    } catch (e) { showNotify(e.message, 'error'); }
}

let currentCheckoutOrder = null;
let checkoutTimer = null;

function openPurchaseModal(itemId, itemType, price, duration, title) {
    currentCheckoutOrder = { itemId, itemType, price, duration, title };
    document.getElementById('checkout-summary').innerHTML = `
        <div class="flex justify-between"><span class="text-gray-400">Item</span><span class="text-white font-bold truncate ml-4">${title}</span></div>
        <div class="flex justify-between"><span class="text-gray-400">Price</span><span class="text-yellow-400 font-bold">${price} USDT</span></div>

    document.getElementById('confirm-pay-btn').classList.add('hidden');
    document.getElementById('verify-status').classList.add('hidden');
    document.getElementById('tx-hash-input').value = '';
    document.getElementById('checkout-modal').classList.remove('hidden');
    document.getElementById('checkout-modal').classList.add('flex');

async function selectNetwork(network) {
    document.querySelectorAll('#network-select button').forEach(b => b.classList.remove('border-brand-500', 'text-brand-400'));
    document.getElementById(`net-${network.toLowerCase()}`).classList.add('border-brand-500', 'text-brand-400');

    if (!getBackendUrl() || !getInitData()) return showNotify('App not configured', 'error');

    try {
        const data = await apiCall('/api/payment/purchase/create', {
            initData: getInitData(),
            itemId: currentCheckoutOrder.itemId,
            itemType: currentCheckoutOrder.itemType,
            paymentMethod: network
        });
        currentCheckoutOrder.orderId = data.orderId;
        document.getElementById('pay-amount').innerText = data.amount;
        document.getElementById('pay-address').innerText = data.address;
        document.getElementById('payment-instructions').classList.remove('hidden');
        document.getElementById('confirm-pay-btn').classList.remove('hidden');
        document.getElementById('confirm-pay-btn').onclick = confirmPurchase;
        startOrderTimer(data.expiresAt);
    } catch (e) { showNotify(e.message, 'error'); }
}

function copyPayAddress() {
    navigator.clipboard.writeText(document.getElementById('pay-address').innerText);
    showNotify('Address copied!', 'info');
}

function startOrderTimer(expiresAt) {
    if (checkoutTimer) clearInterval(checkoutTimer);
    const el = document.getElementById('order-timer');
    checkoutTimer = setInterval(() => {
        const remaining = Math.max(0, expiresAt - Date.now());
        const mins = Math.floor(remaining / 60000);
        const secs = Math.floor((remaining % 60000) / 1000);
        if (el) el.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
        if (remaining === 0) clearInterval(checkoutTimer);
    }, 1000);
}

async function confirmPurchase() {
    const txHash = document.getElementById('tx-hash-input').value.trim();
    if (!txHash) return showNotify('Enter transaction hash', 'error');
    document.getElementById('confirm-pay-btn').classList.add('hidden');
    document.getElementById('verify-status').classList.remove('hidden');
    try {
        await apiCall('/api/payment/purchase/verify', {
            initData: getInitData(),
            orderId: currentCheckoutOrder.orderId,
            txHash
        });
        closeCheckout();
        showNotify('Payment verified! Access granted ✅', 'success');
        await loadEntitlements();
        refreshCurrentTab();
    } catch (e) {
        document.getElementById('verify-status').classList.add('hidden');
        document.getElementById('confirm-pay-btn').classList.remove('hidden');
        showNotify(e.message, 'error');
    }
}

function closeCheckout() {
    if (checkoutTimer) clearInterval(checkoutTimer);
    document.getElementById('checkout-modal').classList.add('hidden');
    document.getElementById('checkout-modal').classList.remove('flex');
}

    const likeCount = document.getElementById('modal-like-count');
    const isLiked = favorites.includes(id);
    favBtn.innerHTML = `<i class="${isLiked ? 'fas text-red-500' : 'far'} fa-heart text-lg"></i>`;
    favBtn.setAttribute('onclick', `toggleFav(event,'${id}',true)`);
    likeCount.innerText = currentItem.likes || 0;

    document.getElementById('loading-ui').classList.add('hidden');
    document.getElementById('result-ui').classList.add('hidden');
    document.getElementById('action-area').classList.remove('hidden');
    document.getElementById('purchase-area').classList.add('hidden');
    document.getElementById('ads-info').classList.add('hidden');

    const isUnlocked = hasAccess(id);
    const btn = document.getElementById('main-action-btn');

    if (currentItem.isPremium && !isUnlocked) {
        adViewsRequired = currentItem.adViewsRequired || 1;
        adViewsCount = 0;
        btn.className = "w-full py-3.5 rounded-xl font-bold text-black shadow-lg shadow-yellow-500/20 active:scale-[0.98] flex items-center justify-center gap-2 bg-gradient-to-r from-yellow-400 to-yellow-500";
        btn.innerHTML = `<i class="fas fa-lock"></i> Unlock (Watch ${adViewsRequired} Ad${adViewsRequired > 1 ? 's' : ''})`;
        btn.onclick = () => startAdSequence();
        document.getElementById('ads-info').innerText = `Watch ads to unlock (${adViewsRequired} step${adViewsRequired > 1 ? 's' : ''})`;
        document.getElementById('ads-info').classList.remove('hidden');

        // Show purchase option if pricing enabled
        db.ref(`premium_pricing/${id}`).once('value', snap => {
            const pricing = snap.val();
            if (pricing && pricing.purchaseEnabled) {
                document.getElementById('purchase-area').classList.remove('hidden');
                document.getElementById('purchase-info').innerHTML = `Price: <span class="text-yellow-400 font-bold">${pricing.price} USDT</span> · ${pricing.duration} days access`;
                window._modalPricing = pricing;
            }
        });
    } else {
        btn.className = "w-full py-3.5 rounded-xl font-bold text-white shadow-lg shadow-brand-500/25 active:scale-[0.98] flex items-center justify-center gap-2 bg-brand-600";
        btn.innerHTML = `<i class="fas fa-wand-magic-sparkles"></i> Generate Prompt`;
        btn.onclick = () => startGeneration();
    }

    document.getElementById('view-modal').classList.remove('hidden');
    document.getElementById('view-modal').classList.add('flex');
}

function closeModal() {
    document.getElementById('view-modal').classList.add('hidden');
    document.getElementById('view-modal').classList.remove('flex');
}

function startPurchase(method) {
    if (!currentItem) return;
    if (method === 'wallet') {
        const p = window._modalPricing;
        if (!p) return;
        buyContentWallet(currentItem.id, p.price, p.duration);
    }
}

function openCryptoCheckout() {
    if (!currentItem || !window._modalPricing) return;
    closeModal();
    const p = window._modalPricing;
    openPurchaseModal(currentItem.id, 'content', p.price, p.duration, currentItem.title);
}

async function startAdSequence() {
    const btn = document.getElementById('main-action-btn');
    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Loading Ad...`;
    try {
        await showMonetagAd();
        await showGigaAd();
        adViewsCount++;
        trackAdView();
        if (adViewsCount >= adViewsRequired) {
            startGeneration();
        } else {
            btn.innerHTML = `<i class="fas fa-lock"></i> Watch Next Ad (${adViewsCount}/${adViewsRequired})`;
        }
    } catch (error) {
        btn.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Retry Unlock`;
        showNotify('Ad failed. Try again.', 'error');
    }
}

function showMonetagAd() {
    return new Promise((resolve) => {
        const zoneId = state.links.monetagZone;
        if (!zoneId) return resolve(true);
        const adFn = window['show_' + zoneId];
        if (typeof adFn === 'function') adFn().then(() => resolve(true)).catch(() => resolve(false));
        else resolve(false);
    });
}

function showGigaAd() {
    return new Promise((resolve) => {
        if (window.showGiga) window.showGiga().then(() => resolve(true)).catch(() => resolve(false));
        else resolve(false);
    });
}

function trackAdView() {
    const today = new Date().toISOString().split('T')[0];
    db.ref(`analytics/ads/${today}`).transaction(c => (c || 0) + 1);
    db.ref(`analytics/totalAds`).transaction(c => (c || 0) + 1);
}

function startGeneration() {
    document.getElementById('action-area').classList.add('hidden');
    document.getElementById('purchase-area').classList.add('hidden');
    document.getElementById('loading-ui').classList.remove('hidden');
    let width = 0;
    const interval = setInterval(() => {
        if (width >= 100) {
            clearInterval(interval);
            showPromptResult();
            addToHistory(currentItem);
        } else {
            width += 4;
            document.getElementById('loading-bar').style.width = width + '%';
            document.getElementById('loading-percent').innerText = width + '%';
        }
    }, 20);
}

function addToHistory(item) {
    historyData = historyData.filter(h => h.id !== item.id);
    historyData.unshift(item);
    localStorage.setItem('runPromt_history', JSON.stringify(historyData));
}

function showPromptResult() {
    document.getElementById('loading-ui').classList.add('hidden');
    document.getElementById('result-ui').classList.remove('hidden');
    document.getElementById('prompt-text').innerText = currentItem.prompt;
    document.getElementById('youtube-link').href = state.links.video || '#';
}

function copyPrompt() {
    navigator.clipboard.writeText(document.getElementById('prompt-text').innerText);
    const btn = document.getElementById('copy-btn');
    btn.className = "w-full py-3 bg-green-500 text-white rounded-xl font-bold text-sm flex items-center justify-center gap-2";
    btn.innerHTML = `<i class="fas fa-check"></i> Copied!`;
    setTimeout(() => {
        btn.className = "w-full py-3 bg-white text-black rounded-xl font-bold text-sm hover:bg-gray-200 transition-colors shadow-lg active:scale-[0.98] flex items-center justify-center gap-2";
        btn.innerHTML = `<i class="fas fa-copy"></i> Copy Image Prompt`;
    }, 2000);
}

// ─── FAVOURITES ───
window.toggleFav = function(e, id, isModal = false) {
    e.stopPropagation();
    const isLiked = favorites.includes(id);
    if (isLiked) {
        favorites = favorites.filter(f => f !== id);
        db.ref(`prompts/${id}/likes`).transaction(c => (c || 0) > 0 ? c - 1 : 0);
    } else {
        favorites.push(id);
        db.ref(`prompts/${id}/likes`).transaction(c => (c || 0) + 1);
    }
    localStorage.setItem('runPromt_favs', JSON.stringify(favorites));
    if (isModal) {
        const favBtn = document.getElementById('modal-fav-btn');
        const countSpan = document.getElementById('modal-like-count');
        const newCount = (parseInt(countSpan.innerText) || 0) + (isLiked ? -1 : 1);
        favBtn.innerHTML = `<i class="${!isLiked ? 'fas text-red-500 animate-heart-beat' : 'far'} fa-heart text-lg"></i>`;
        countSpan.innerText = newCount >= 0 ? newCount : 0;
    } else { refreshCurrentTab(); }
};

// ─── PROFILE ───

    document.getElementById('content-area').className = "grid grid-cols-1 gap-0 pb-6";
    document.getElementById('content-area').innerHTML = `
        <div class="col-span-1">
            <div class="flex flex-col items-center mb-8 animate-fade-in">
                <div class="w-24 h-24 rounded-full p-1 bg-gradient-to-tr from-brand-500 to-purple-600 mb-4 shadow-xl">
                    <img src="${state.user.photo}" onerror="this.src='https://ui-avatars.com/api/?name=${state.user.name}&background=random'" class="w-full h-full rounded-full border-4 border-dark-900 object-cover">
                </div>
                <h2 class="text-2xl font-bold text-white">${state.user.name}</h2>
                <span class="text-xs font-mono bg-dark-800 text-brand-400 px-3 py-1 rounded-full mt-2 border border-brand-500/20">ID: ${state.user.id || 'N/A'}</span>
                <div class="mt-3 bg-green-500/20 border border-green-500/40 text-green-400 text-sm font-bold px-4 py-2 rounded-full cursor-pointer" onclick="switchTab('wallet')">
                    <i class="fas fa-wallet mr-2"></i>Wallet: $${parseFloat(state.walletBalance).toFixed(2)}
                </div>
            </div>
            <div class="bg-dark-800 rounded-2xl border border-white/5 overflow-hidden mb-4 animate-slide-up">
                <div onclick="showHistory()" class="flex items-center justify-between p-4 border-b border-white/5 cursor-pointer hover:bg-white/5 transition-colors">
                    <div class="flex items-center gap-4"><div class="w-6 text-center"><i class="fas fa-history text-blue-400 text-lg"></i></div><span class="text-sm font-medium text-gray-200">History</span></div>
                    <i class="fas fa-chevron-right text-gray-600 text-xs"></i>
                </div>
                <div onclick="switchTab('store')" class="flex items-center justify-between p-4 border-b border-white/5 cursor-pointer hover:bg-white/5 transition-colors">
                    <div class="flex items-center gap-4"><div class="w-6 text-center"><i class="fas fa-store text-purple-400 text-lg"></i></div><span class="text-sm font-medium text-gray-200">Package Store</span></div>
                    <i class="fas fa-chevron-right text-gray-600 text-xs"></i>
                </div>
                ${profileLink('fas fa-user-plus text-green-400', 'Follow Me', state.links.follow)}
                ${profileLink('fas fa-book-open text-yellow-400', 'How to use?', state.links.howTo)}
                <div onclick="openShareUI()" class="flex items-center justify-between p-4 border-b border-white/5 cursor-pointer hover:bg-white/5 transition-colors">
                    <div class="flex items-center gap-4"><div class="w-6 text-center"><i class="fas fa-share-nodes text-purple-400 text-lg"></i></div><span class="text-sm font-medium text-gray-200">Share App</span></div>
                    <i class="fas fa-chevron-right text-gray-600 text-xs"></i>
                </div>
            </div>
            <div class="bg-dark-800 rounded-2xl border border-white/5 overflow-hidden animate-slide-up">
                ${profileLink('fas fa-envelope text-red-400', 'Contact Us', state.links.contact)}
                ${profileLink('fas fa-code text-cyan-400', 'Developer Info', PERMANENT_DEV_LINK)}
                ${profileLink('fas fa-shield-alt text-gray-400', 'Privacy Policy', state.links.privacy)}
            </div>
        </div>`;
    document.getElementById('empty-state').classList.add('hidden');
    document.getElementById('empty-state').classList.remove('flex');
}

function showHistory() {
    document.getElementById('content-area').innerHTML = `<div class="col-span-2 flex items-center gap-2 mb-2 px-2 text-brand-500"><i class="fas fa-history"></i><span class="font-bold">Generated History</span></div>`;
    renderGrid(historyData.map(h => state.prompts.find(p => p.id === h.id) || h));
}

function profileLink(icon, text, url) {
    return `<a href="${url || '#'}" target="_blank" class="flex items-center justify-between p-4 border-b border-white/5 last:border-0 hover:bg-white/5 transition-colors"><div class="flex items-center gap-4"><div class="w-6 text-center"><i class="${icon} text-lg"></i></div><span class="text-sm font-medium text-gray-200">${text}</span></div><i class="fas fa-chevron-right text-gray-600 text-xs"></i></a>`;
}

// ─── SHARE ───
function openShareUI() {
    const link = state.links.botLink || "https://t.me/UniquePromptBot";
    document.getElementById('share-link-input').value = link;
    document.getElementById('share-modal').classList.remove('hidden');
    document.getElementById('share-modal').classList.add('flex');
}
function closeShareUI() {
    document.getElementById('share-modal').classList.add('hidden');
    document.getElementById('share-modal').classList.remove('flex');
}
function copyShareLink() {
    navigator.clipboard.writeText(document.getElementById('share-link-input').value);
    const btn = document.getElementById('share-copy-btn');
    btn.innerHTML = `<i class="fas fa-check"></i> Copied!`;
    btn.classList.add('bg-green-500', 'text-white');
    btn.classList.remove('bg-white', 'text-black');
    setTimeout(() => {
        btn.innerHTML = `<i class="fas fa-copy"></i> Copy Link`;
        btn.classList.remove('bg-green-500', 'text-white');
        btn.classList.add('bg-white', 'text-black');
    }, 2000);
}
function shareSocial(platform) {
    const link = encodeURIComponent(state.links.botLink || "https://t.me/UniquePromptBot");
    const text = encodeURIComponent("Check out this amazing AI Prompt Generator - Unique Prompt!");
    let url = '';
    if (platform === 'tg') url = `https://t.me/share/url?url=${link}&text=${text}`;
    if (platform === 'wa') url = `https://wa.me/?text=${text}%20${link}`;
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) window.Telegram.WebApp.openLink(url);
    else window.open(url, '_blank');
}
</script>
